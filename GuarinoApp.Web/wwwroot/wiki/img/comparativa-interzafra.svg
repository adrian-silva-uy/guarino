<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#f8f9fa"/>
  <rect x="50" y="50" width="700" height="300" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
  <text x="400" y="100" font-family="Arial" font-size="24" font-weight="bold" fill="#f57c00" text-anchor="middle">Comparativa Interzafra Semanal</text>
  <rect x="100" y="140" width="600" height="180" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
  <text x="400" y="170" font-family="Arial" font-size="16" fill="#666" text-anchor="middle">Semanas del año</text>
  <text x="120" y="330" font-family="Arial" font-size="12" fill="#666" text-anchor="middle">Zafra 2025</text>
  <text x="400" y="330" font-family="Arial" font-size="12" fill="#666" text-anchor="middle">Zafra 2026</text>
  <text x="700" y="330" font-family="Arial" font-size="12" fill="#666" text-anchor="middle">Zafra 2027</text>
  <line x1="100" y1="280" x2="700" y2="280" stroke="#999" stroke-width="1"/>
  <line x1="100" y1="280" x2="100" y2="150" stroke="#999" stroke-width="1"/>
  <text x="400" y="360" font-family="Arial" font-size="14" fill="#666" text-anchor="middle">Volcados acumulados (kg) por semana</text>
