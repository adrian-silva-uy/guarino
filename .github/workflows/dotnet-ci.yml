name: .NET 8 CI

on:
  pull_request:
    branches: [ master ]
  push:
    branches:
      - master
      - security/hardening-defaults-2026-11

permissions:
  contents: read

concurrency:
  group: dotnet-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore GuarinoApp.sln

      - name: Build
        run: dotnet build GuarinoApp.sln --configuration Release --no-restore

      - name: Install Playwright Chromium and OS dependencies
        run: pwsh GuarinoApp.Tests/bin/Release/net8.0/playwright.ps1 install --with-deps chromium

      - name: Test
        run: dotnet test GuarinoApp.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"
